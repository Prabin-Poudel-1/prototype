services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pulse-data:/var/lib/postgresql/data
volumes:
  pulse-data:
